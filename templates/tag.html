{% extends "base.html" %}
{% block content %}
<h2 class="sec">{{ tag_title }}</h2><p class="lede">{{ item_count }} items, best first.</p>
<table><tr><th class="num">rank</th><th>item</th><th>posted by</th></tr>
{% for r in rows %}
<tr><td class="num">{{ r.rank }}</td><td>{{ r.title }}</td><td class="mut">{{ r.owner }}</td></tr>
{% endfor %}
</table>
{% endblock %}
